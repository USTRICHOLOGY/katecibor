DC.define("Footer", document.getElementById("tpl-Footer"), (function () {
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { progress: 0.045 };
    this.setFoot = (el) => { this.foot = el; };
    this.setBand = (el) => { this.band = el; };
    this.measure = () => {
      const el = this.band ? this.band.parentNode : null; if (!el) return;
      const win = el.ownerDocument.defaultView || window;
      const r = el.getBoundingClientRect(), h = r.height || 1;
      const t = Math.max(0, Math.min(1, (win.innerHeight - r.top) / h));
      const p = 0.045 + (1 - 0.045) * t;

    };
  }
  componentDidMount() {
    const win = (this.foot && this.foot.ownerDocument.defaultView) || window;
    this.win = win;
    this.measure();
    win.addEventListener('scroll', this.measure, { passive: true });
    win.addEventListener('resize', this.measure, { passive: true });
    this.tick = setTimeout(this.measure, 300);
  }
  componentWillUnmount() {
    if (this.win) { this.win.removeEventListener('scroll', this.measure); this.win.removeEventListener('resize', this.measure); }

  }
  renderVals() {
    const n = Math.max(3, Math.round(Number(this.props.bars) || 9));

    const bars = [];

      const t = mid === 0 ? 0 : Math.abs(i - mid) / mid;
      const eased = 1 - Math.pow(t, 1.24);

    }
